<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Taskya AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48"><path d="M8 9h32l-5 8H29l-9 22-7-2 7-20H8z"/><path class="bolt" d="M26 18h9l-7 8h6L20 40l4-13h-6z"/></svg>
      </div>
      <div><h1>Taskya AI</h1><p>Think → Act → Verify → Done</p></div>
    </div>
    <label>Language <select id="lang"><option value="auto">Auto</option><option value="hi">हिन्दी</option><option value="hinglish">Hinglish</option><option value="en">English</option><option value="bn">বাংলা</option><option value="mr">मराठी</option><option value="ta">தமிழ்</option><option value="te">తెలుగు</option></select></label>
  </header>

  <section id="chat"><div id="welcome"><h2>Ask Taskya anything...</h2><p>Research, websites, files, Excel/PDF, calculations and multi-step tasks.</p></div></section>

  <div class="progress"><span id="events">Ready</span><button id="cancel" disabled>Cancel Task</button></div>

  <form id="f">
    <textarea id="i" placeholder="Ask Taskya anything..."></textarea>
    <div class="composer-bar">
      <div class="composer-tools">
        <button type="button" class="icon-btn" id="fileBtn" title="Attach file" aria-label="Attach file">
          <svg viewBox="0 0 24 24"><path d="M7 3.5h7l4 4v13H7z"/><path d="M14 3.5v4h4"/><path d="M9.5 14.5h5M9.5 17.5h5"/></svg>
        </button>
        <button type="button" class="tool-btn" id="webBtn" title="Use web search">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.8 12h16.4M12 3.5c2.2 2.3 3.3 5.1 3.3 8.5S14.2 18.2 12 20.5c-2.2-2.3-3.3-5.1-3.3-8.5S9.8 5.8 12 3.5z"/></svg><span>Web</span>
        </button>
        <button type="button" class="tool-btn" id="mic" title="Voice input">
          <svg viewBox="0 0 24 24"><rect x="8.5" y="3" width="7" height="11" rx="3.5"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6"/></svg><span>Voice</span>
        </button>
        <input id="file" type="file" hidden>
      </div>
      <div class="composer-right">
        <button type="button" class="tool-btn" id="speak" title="Read answer aloud"><svg viewBox="0 0 24 24"><path d="M5 10v4h4l5 4V6l-5 4z"/><path d="M17 9.5a4 4 0 0 1 0 5M19.5 7a7 7 0 0 1 0 10"/></svg><span>Read</span></button>
        <button class="send-btn" title="Run Task" aria-label="Run Task"><svg viewBox="0 0 24 24"><path d="M12 19V5M7 10l5-5 5 5"/></svg></button>
      </div>
    </div>
    <p id="voiceStatus"></p>
  </form>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
